# Build Linux and Windows binaries and publish them as one GitHub Release, on
# a `v*` tag.
#
# The builds happen here rather than on a developer's machine for one concrete
# reason: a Linux binary carries the glibc of whatever built it. A machine
# running a rolling distribution produces something most people cannot run at
# all, and the failure is a loader error at startup rather than anything the
# port could report. An ubuntu-latest runner is a known, older baseline.
# Windows has no such floor, but building it beside the Linux one means both
# pass the same version checks and land on the same release page.
#
# SDL2 is handled differently on each, and on purpose. On Linux it is linked
# dynamically and NOT bundled, so the tarball needs SDL2 installed on the
# target - a distribution's own package is better maintained than a copy frozen
# at release time. Windows has no system SDL2 to defer to, so there it is linked
# statically, with the static CRT, and the zip is one .exe. SDL2 is zlib
# licensed, which asks only that its notice travel with it, and it does.
#
# The release ships no game data, which is the whole rule of this repository -
# the binary is inert without the player's own TUBES.RES.
#
# Four jobs: `version` settles the number once, the two builds use it, and
# `publish` waits for both. A release is created only when BOTH platforms
# built and tested, so a tag never yields a page carrying half its files.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The tag and src/version.h must agree. They are one fact in two places the
  # moment a tag exists, and a release whose binary prints a different number
  # than the tag it came from is worse than no release.
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.check.outputs.ver }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag against src/version.h
        id: check
        run: |
          MAJOR=$(sed -n 's/^#define TUBES_VERSION_MAJOR \([0-9]*\).*/\1/p' src/version.h)
          MINOR=$(sed -n 's/^#define TUBES_VERSION_MINOR \([0-9]*\).*/\1/p' src/version.h)
          PATCH=$(sed -n 's/^#define TUBES_VERSION_PATCH \([0-9]*\).*/\1/p' src/version.h)
          VER="$MAJOR.$MINOR.$PATCH"
          echo "tag=$TAG header=$VER"
          [ "$TAG" = "v$VER" ] || { echo "::error::tag $TAG does not match src/version.h ($VER)"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Test
        run: ./build/tubes-tests

      # The binary must also agree, which is a different check from the one in
      # `version`: that compared two files, this asks the program what it
      # thinks.
      - name: Check the binary reports the same version
        run: |
          OUT=$(./build/tubes-port --version)
          echo "$OUT"
          [ "$OUT" = "tubes-port $VER" ] || { echo "::error::binary reports '$OUT'"; exit 1; }

      - name: Package
        run: |
          DIR="tubes-port-$VER-linux-x86_64"
          mkdir "$DIR" dist
          cp build/tubes-port README.md LICENSE "$DIR/"
          strip "$DIR/tubes-port"
          tar czf "dist/$DIR.tar.gz" "$DIR"
          (cd dist && sha256sum "$DIR.tar.gz" | tee "$DIR.tar.gz.sha256")

      # Measured here, where they are true, and handed to `publish` as a file:
      # the glibc floor is a property of this runner, not a number anyone
      # should be maintaining by hand.
      - name: Record what the build was made against
        run: |
          {
            echo "- **Linux**: built on \`ubuntu-latest\` against SDL $(pkg-config --modversion sdl2),"
            echo "  glibc $(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$') (the floor for this binary)."
            echo "  Tests: $(./build/tubes-tests | tail -1)."
          } > build-linux.md
          cat build-linux.md

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*
            build-linux.md

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.ver }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The same triplet and CRT as the Windows job in build.yml, so the thing
      # released is the thing CI has been checking on every push.
      - name: Install SDL2
        run: |
          vcpkg install sdl2:x64-windows-static
          # The runner gives C:\vcpkg; bash and CMake both want forward slashes.
          echo "VCPKG=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release -j

      - name: Test
        run: ./build/Release/tubes-tests.exe

      # `tr -d '\r'`: the console writes CRLF, and a trailing CR would fail the
      # comparison with a message that prints as if the strings were equal.
      - name: Check the binary reports the same version
        run: |
          OUT=$(./build/Release/tubes-port.exe --version | tr -d '\r')
          echo "$OUT"
          [ "$OUT" = "tubes-port $VER" ] || { echo "::error::binary reports '$OUT'"; exit 1; }

      # SDL2 is linked in, so its notice ships beside the LICENSE that
      # already names this project's other vendored terms.
      - name: Package
        run: |
          DIR="tubes-port-$VER-windows-x86_64"
          SDL_SHARE="$VCPKG/installed/x64-windows-static/share/sdl2"
          mkdir "$DIR" dist
          cp build/Release/tubes-port.exe README.md LICENSE "$DIR/"
          cp "$SDL_SHARE/copyright" "$DIR/LICENSE-SDL2.txt"
          7z a -tzip "dist/$DIR.zip" "$DIR"
          (cd dist && sha256sum "$DIR.zip" | tee "$DIR.zip.sha256")

      - name: Record what the build was made against
        run: |
          SDL_VER=$(vcpkg list sdl2:x64-windows-static | awk '$1 ~ /^sdl2:/ {print $2; exit}')
          {
            echo "- **Windows**: built on \`windows-latest\` with MSVC, SDL $SDL_VER linked statically"
            echo "  with the static CRT, so it needs no DLLs and no redistributable."
            echo "  Tests: $(./build/Release/tubes-tests.exe | tail -1 | tr -d '\r')."
          } > build-windows.md
          cat build-windows.md

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*
            build-windows.md

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # The static markdown is a QUOTED heredoc, so its backticks stay
      # backticks instead of running as commands. The measured lines each
      # build job wrote are appended after it.
      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          An SDL/C++ reimplementation of Tubes, a 1994 DOS puzzle game,
          translated out of the original binary.

          ## You need your own copy of the game

          No game data ships here, and none ever will. Unpack the archive and
          point the port at the folder holding your `TUBES.RES`. `DRIVERS.RES`
          beside it adds FM music. The game's own executable is never opened,
          so its LZEXE packing does not matter.

          ## Windows

          Unzip, then either run it from a command prompt:

              tubes-port.exe --gamedir C:\path\to\your\tubes

          or copy `tubes-port.exe` into the game's folder and double-click it,
          since the game directory defaults to the one it starts in. A console
          window opens beside the game; that is where errors are reported.

          ## Linux

              ./tubes-port --gamedir /path/to/your/tubes

          Needs SDL2 installed (`libsdl2-2.0-0` on Debian and Ubuntu). It is
          linked dynamically and deliberately not bundled, because a
          distribution's own package is better maintained than a copy frozen at
          release time. On an older glibc than the one below, build from source
          instead: three commands, needing only SDL2, CMake 3.16 or newer, and a
          C++17 compiler. See the README.
          EOF
          {
            echo
            echo "---"
            echo
            cat build-linux.md build-windows.md
          } >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "tubes-port $VER" \
            --notes-file notes.md \
            dist/*
